<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Escolher curso</title>
        <style>body{font-family:system-ui,sans-serif;background:#d4d8db;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#1a1a18;padding:1.5rem}.card{background:#fff;border:1px solid #e0dfd8;border-radius:14px;padding:2rem;width:100%;max-width:520px;box-shadow:0 8px 28px rgba(0,0,0,.06)}h1{font-size:1.35rem;margin-bottom:.5rem}p{color:#666;margin-bottom:1.5rem;line-height:1.5}.arquivo{font-size:.875rem;background:#f5f5f0;border:1px solid #e0dfd8;padding:.75rem;border-radius:8px;margin-bottom:1.5rem;word-break:break-word}form{display:grid;gap:.75rem}button{padding:.85rem 1rem;border:none;border-radius:9px;background:#1D9E75;color:white;font-weight:600;cursor:pointer;font-size:.95rem}.secondary{background:#1a1a18}</style>
    </head>
    <body>
        <div class="card">
            <h1>Escolha o que deseja sincronizar</h1>
            <p>O arquivo foi enviado. Agora escolha se deseja processar CC, SI ou ambos.</p>
            {% if arquivo_nome %}
            <div class="arquivo">Arquivo: <strong>{{ arquivo_nome }}</strong></div>
            {% endif %}{% if messages %}{% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}{% endif %}
            <form method="post" action="{% url 'selecionar_curso' %}">{% csrf_token %}<button type="submit" name="modo" value="cc">Fazer apenas Ciência da Computação</button><button type="submit" name="modo" value="si">Fazer apenas Sistemas de Informação</button><button type="submit" name="modo" value="ambos" class="secondary">Fazer ambos</button></form>
        </div>
    </body>
</html>
