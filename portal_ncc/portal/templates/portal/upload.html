<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload - Portal Acadêmico</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #f5f5f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    border: 1px solid #e0dfd8;
    padding: 2.5rem;
    width: 100%;
    max-width: 480px;
  }
  h1 { font-size: 1.25rem; font-weight: 500; color: #1a1a18; margin-bottom: 0.5rem; }
  p.sub { font-size: 0.875rem; color: #6b6b66; margin-bottom: 2rem; }

  .drop-zone {
    border: 2px dashed #c8c7c0;
    border-radius: 8px;
    padding: 2.5rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
  }
  .drop-zone:hover, .drop-zone.over {
    border-color: #1D9E75;
    background: #f0faf6;
  }
  .drop-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .drop-icon {
    width: 40px; height: 40px; margin: 0 auto 0.75rem;
    background: #e1f5ee; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .drop-icon svg { width: 20px; height: 20px; stroke: #0F6E56; fill: none; stroke-width: 2; }
  .drop-label { font-size: 0.9rem; color: #3d3d3a; font-weight: 500; }
  .drop-hint  { font-size: 0.8rem; color: #9c9a92; margin-top: 0.25rem; }
  #nome-arquivo { font-size: 0.85rem; color: #1D9E75; margin-top: 0.75rem; font-weight: 500; }

  .btn {
    display: block; width: 100%; margin-top: 1.5rem;
    padding: 0.75rem; border-radius: 8px; border: none;
    font-size: 0.95rem; font-weight: 500; cursor: pointer;
    background: #1D9E75; color: #fff; transition: background 0.2s;
  }
  .btn:hover { background: #0F6E56; }
  .btn:disabled { background: #c8c7c0; cursor: not-allowed; }

  .msgs { margin-bottom: 1.25rem; }
  .msg-erro {
    background: #fcebeb; color: #791F1F;
    border: 1px solid #f09595; border-radius: 6px;
    padding: 0.65rem 1rem; font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Importar lista de alunos</h1>
  <p class="sub">Envie o arquivo CSV exportado do sistema acadêmico para classificar e sincronizar os grupos.</p>

  {% if messages %}
  <div class="msgs">
    {% for msg in messages %}
    <div class="msg-erro">{{ msg }}</div>
    {% endfor %}
  </div>
  {% endif %}

  <form method="post" enctype="multipart/form-data" id="form-upload">
    {% csrf_token %}
    <div class="drop-zone" id="drop-zone">
      <input type="file" name="arquivo" id="arquivo" accept=".csv,.ods,.xlsx" required>
      <div class="drop-icon">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </div>
      <div class="drop-label">Clique ou arraste o arquivo aqui</div>
      <div class="drop-hint">CSV, ODS ou XLSX</div>
    </div>
    <div id="nome-arquivo"></div>
    <button class="btn" id="btn-enviar" disabled>Processar arquivo</button>
  </form>
</div>

<script>
const input    = document.getElementById('arquivo');
const zona     = document.getElementById('drop-zone');
const nomEl    = document.getElementById('nome-arquivo');
const btn      = document.getElementById('btn-enviar');

input.addEventListener('change', () => {
  if (input.files[0]) {
    nomEl.textContent = input.files[0].name;
    btn.disabled = false;
  }
});
zona.addEventListener('dragover',  e => { e.preventDefault(); zona.classList.add('over'); });
zona.addEventListener('dragleave', () => zona.classList.remove('over'));
zona.addEventListener('drop', e => {
  e.preventDefault();
  zona.classList.remove('over');
  input.files = e.dataTransfer.files;
  input.dispatchEvent(new Event('change'));
});
</script>
</body>
</html>
