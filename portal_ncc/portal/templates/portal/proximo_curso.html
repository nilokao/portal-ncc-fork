<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Continuar sincronização</title>
        <style>body{font-family:system-ui,sans-serif;background:#d4d8db;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#1a1a18;padding:1.5rem}.card{background:#fff;border:1px solid #e0dfd8;border-radius:14px;padding:2rem;width:100%;max-width:480px;box-shadow:0 8px 28px rgba(0,0,0,.06)}h1{font-size:1.35rem;margin-bottom:.5rem}p{color:#666;margin-bottom:1.5rem;line-height:1.5}form{display:grid;gap:.75rem}button,a{display:block;text-align:center;padding:.85rem 1rem;border:none;border-radius:9px;text-decoration:none;font-weight:600;cursor:pointer;font-size:.95rem}button{background:#1D9E75;color:white}a{background:#1a1a18;color:white}</style>
    </head>
    <body>
        <div class="card">
            <h1>Sincronização concluída</h1>
            <p>Deseja continuar e fazer agora <strong>{{ label }}</strong> usando o mesmo arquivo enviado?</p>
            {% if arquivo_nome %}
            <p>Arquivo: <strong>{{ arquivo_nome }}</strong></p>
            {% endif %}
            <form method="post" action="{% url 'selecionar_curso' %}">{% csrf_token %}<button type="submit" name="modo" value="{{ proximo }}">Fazer {{ label }}</button></form>
            <br><a href="{% url 'finalizar' %}">Sair e finalizar</a>
        </div>
    </body>
</html>
