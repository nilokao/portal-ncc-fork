<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Sincronizado - Portal Acadêmico</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f5f0; min-height: 100vh;
         display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 12px; border: 1px solid #e0dfd8;
          padding: 2.5rem; max-width: 400px; text-align: center; }
  .icone { width: 48px; height: 48px; background: #e1f5ee; border-radius: 50%;
           display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }
  .icone svg { width: 24px; height: 24px; stroke: #0F6E56; fill: none; stroke-width: 2.5; }
  h1 { font-size: 1.15rem; font-weight: 500; margin-bottom: 0.5rem; }
  p  { font-size: 0.875rem; color: #6b6b66; line-height: 1.6; margin-bottom: 1.5rem; }
  a  { display: inline-block; padding: 0.65rem 1.4rem; border-radius: 8px;
       background: #1D9E75; color: #fff; text-decoration: none; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="card">
  <div class="icone">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <h1>Grupos sincronizados!</h1>
  <p>Os grupos do Google Workspace foram atualizados com sucesso.</p>
  <a href="{% url 'upload' %}">Importar outro arquivo</a>
</div>
</body>
</html>
